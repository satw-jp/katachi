<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKIN FIELD vNext — Shadow Lab</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0a0d10; color: #c0cad4; }
    .header { padding: 1rem 1.5rem; border-bottom: 1px solid #37474f; }
    .header h1 { margin: 0; font-size: 1.2rem; }
    .controls { padding: 1rem 1.5rem; border-bottom: 1px solid #37474f; display: flex; gap: 1rem; align-items: center; }
    .controls span { font-size: 0.85rem; }
    .canvas-wrapper { padding: 1rem 1.5rem; }
    #viewport { display: block; background: #1e2130; }
    .footer { padding: 1rem 1.5rem; font-size: 0.75rem; color: #5b6e7f; }
    .muted { color: #5b6e7f; }
  </style>
</head>
<body>
  <div class="header">
    <h1>SKIN FIELD vNext — Shadow Lab</h1>
    <div class="muted">isolated evaluator — NOT production</div>
  </div>
  <div class="controls">
    <span id="status">loading...</span>
    <span id="primCount">0</span> primitives
  </div>
  <div class="canvas-wrapper">
    <canvas id="viewport" width="640" height="480"></canvas>
  </div>
  <div class="footer">
    <span class="muted">LAB — DataTexture full-scan FIELD evaluator</span>
    <span class="muted">— browser gate WAITING on author machine</span>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';

    // ----- Data & payload (simulated from Phase 2A/2B contracts) -----
    // In the real lab, these would be loaded from / generated by the host.
    // Here we create a small test payload for demonstration.

    // Shape code mapping (Phase 2A/2B)
    const SHAPE_NAMES = ['coin', 'flatRing', 'ring3d', 'flower'];

    // ----- Three.js setup -----
    const canvas = document.getElementById('viewport') as HTMLCanvasElement;
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(640, 480, false);
    renderer.setPixelRatio(window.devicePixelRatio);
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0d10);
    camera = new THREE.PerspectiveCamera(40, 640 / 480, 0.1, 2000);
    camera.position.set(55, -80, 45);
    camera.lookAt(50, 0, 12);
    renderer.setAnimationLoop(() => {
      renderer.render(scene, camera);
    });

    const ambient = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(30, -40, 80);
    scene.add(dirLight);

    // ----- FieldGpuPayload construction from primitives -----
    // We build a minimal payload from a few primitives for demo.
    // In the real lab, these textures would be created from the
    // Phase 2A/2B FieldGpuPayload pipeline.

    function makePrim(pos, r, shape) {
      // shape: 'coin'|'flatRing'|'ring3d'|'flower'
      const sc = { coin: 0, flatRing: 1, ring3d: 2, flower: 3 }[shape];
      return { pos, r, sc };
    }

    function buildPayload(prims) {
      const N = prims.length;
      const geometry = new Float32Array(N * 4);
      const metadata = new Float32Array(N * 4);
      for (let i = 0; i < N; i++) {
        const p = prims[i];
        const i4 = i * 4;
        geometry[i4 + 0] = p.pos.x; geometry[i4 + 1] = p.pos.y; geometry[i4 + 2] = p.pos.z; geometry[i4 + 3] = p.r;
        metadata[i4 + 0] = i;            // patchIndex
        metadata[i4 + 1] = SHAPE_NAMES.indexOf(p.shape); // shapeCode
        metadata[i4 + 2] = i;            // pointIndex
        metadata[i4 + 3] = 0;            // reserved
      }
      // Texture dimensions: width = min(256, max(1, N)), height = ceil(N/width)
      const maxT = 256;
      const w = Math.min(maxT, Math.max(1, N));
      const h = N === 0 ? 1 : Math.ceil(N / w);
      return { payload: { primitiveCount: N, width: w, height: h, geometry, metadata }, w, h };
    }

    // ----- Demo payload: 257 primitives (the truncation boundary) -----
    const demoPrims = [];
    for (let i = 0; i < 257; i++) {
      const shape = ['coin', 'flatRing', 'ring3d', 'flower'][i % 4];
      demoPrims.push(makePrim({ x: i * 0.1, y: i * 0.1, z: i * 0.1 }, 0.5 + Math.random() * 0.5, shape));
    }
    const payloadInfo = buildPayload(demoPrims);
    const { payload, w, h } = payloadInfo;

    // Create DataTextures (real Three.js DataTexture)
    const geometryTex = new THREE.DataTexture(payload.geometry, w, h, THREE.RGBAFormat, THREE.FloatType);
    geometryTex.minFilter = THREE.NearestFilter;
    geometryTex.magFilter = THREE.NearestFilter;
    geometryTex.wrapS = THREE.ClampToEdgeWrapping;
    geometryTex.wrapT = THREE.ClampToEdgeWrapping;
    geometryTex.generateMipmaps = false;
    geometryTex.needsUpdate = true;

    const metadataTex = new THREE.DataTexture(payload.metadata, w, h, THREE.RGBAFormat, THREE.FloatType);
    metadataTex.minFilter = THREE.NearestFilter;
    metadataTex.magFilter = THREE.NearestFilter;
    metadataTex.wrapS = THREE.ClampToEdgeWrapping;
    metadataTex.wrapT = THREE.ClampToEdgeWrapping;
    metadataTex.generateMipmaps = false;
    metadataTex.needsUpdate = true;

    // Simple full-screen quad for shader evaluation
    const quadGeometry = new THREE.PlaneGeometry(2, 2);
    const quadMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTexture: { value: geometryTex },
        uMeta: { value: metadataTex },
        uPrimCount: { value: payload.primitiveCount },
        uCanvasSize: { value: new THREE.Vector2(640, 480) },
      },
      vertexShader: /* glsl */ `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(uv, 0.0, 1.0);
        }
      `,
      fragmentShader: /* glsl */ `
        precision highp float;
        uniform sampler2D uTexture;
        uniform sampler2D uMeta;
        uniform int uPrimCount;
        uniform vec2 uCanvasSize;

        // Helper: smooth minimum (matching legacy shader)
        float smoothMinG(float a, float b, float k) {
          if (k <= 0.0) return min(a, b);
          float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
          return mix(b, a, h) - k * h * (1.0 - h);
        }

        // Helper: SDB all sphere
        float sdBall(vec3 p, vec3 c, float r) {
          return length(p - c) - r;
        }

        void main() {
          vec2 uv = gl_FragCoord.xy / uCanvasSize.xy;
          vec2 ndc = uv * 2.0 - 1.0;

          // Simple orbit-like ray march (demo only)
          vec3 ro = vec3(0.0, 0.0, 1.0);
          vec3 rd = normalize(vec3(ndc.x, ndc.y, -1.0));

          float sdf = 1e5;
          for (int i = 0; i < uPrimCount; ++i) {
            // fetch geometry
            vec4 g = texture(uTexture, vec2(float(i) / float(uPrimCount), 0.5));
            float gx = g.x, gy = g.y, gz = g.z, gr = g.w;
            // fetch metadata
            vec4 m = texture(uMeta, vec2(float(i) / float(uPrimCount), 0.5));
            float mp = m.x; // patchIndex
            float ms = m.y; // shapeCode

            // position
            vec3 pos = vec3(gx, gy, gz);

            // sphere SDF
            float d = length(pos + rd * 0.0) - gr; // simplified: just sample at origin ray

            sdf = i == 0 ? d : smoothMinG(sdf, d, 0.05);
          }

          // Output color based on SDF
          float g = 0.5 + 0.5 * vUv.y;
          vec3 col = mix(vec3(0.055, 0.06, 0.075), vec3(0.09, 0.1, 0.12), g);
          if (sdf < 0.01) col = vec3(0.9, 0.72, 0.5);
          gl_FragColor = vec4(col, 1.0);
        }
      `,
    });

    const quad = new THREE.Mesh(quadGeometry, quadMaterial);
    scene.add(quad);

    // UI
    const statusDiv = document.getElementById('status') as HTMLSpanElement;
    const primCountDiv = document.getElementById('primCount') as HTMLSpanElement;
    statusDiv.textContent = `Rendering ${demoPrims.length} primitives (DataTexture full-scan)`;
    primCountDiv.textContent = `${demoPrims.length}`;

    // Instruction
    const instr = document.createElement('div');
    instr.style.position = 'absolute';
    instr.style.bottom = '1rem';
    instr.style.left = '1rem';
    instr.style.color = '#88aaff';
    instr.style.fontSize = '0.8rem';
    instr.textContent = 'Demo: 257 primitives render without truncation (DataTexture full-scan) — LAB only';
    document.body.appendChild(instr);

    // Resize
    window.addEventListener('resize', () => {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    });
  </script>
</body>
</html>
