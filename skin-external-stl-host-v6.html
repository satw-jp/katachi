<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SKIN External STL Host · V6 adapter gate</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10161b; color: #edf3f6; }
      body { margin: 0; min-height: 100vh; }
      #app { display: grid; grid-template-columns: 370px 1fr; min-height: 100vh; }
      aside { padding: 18px; background: #192128; border-right: 1px solid #34414a; overflow: auto; }
      main { min-width: 0; position: relative; }
      h1 { font-size: 18px; margin: 0 0 6px; }
      h2 { font-size: 12px; color: #a8d3df; margin: 18px 0 8px; text-transform: uppercase; letter-spacing: .08em; }
      p, label, button { font-size: 12px; }
      p { color: #b9c5cb; line-height: 1.45; }
      button, input, select { box-sizing: border-box; width: 100%; border: 1px solid #4b5b64; border-radius: 4px; background: #10161a; color: #edf3f6; padding: 7px; }
      button { cursor: pointer; background: #284b5a; }
      button.secondary { background: #202f37; }
      button:hover { background: #356b7f; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .row button { margin-top: 8px; }
      .check { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
      .check input { width: auto; }
      .meta { white-space: pre-wrap; word-break: break-word; font: 11px/1.45 ui-monospace, monospace; color: #cbd7dc; background: #10161a; border: 1px solid #2c3941; border-radius: 4px; padding: 9px; }
      .status { color: #91dda0; min-height: 18px; }
      .error { color: #ff9e9e; }
      #viewport { width: 100%; height: 100vh; display: block; }
      #legend { position: absolute; left: 16px; bottom: 16px; padding: 8px 10px; background: rgba(10, 14, 17, .78); border: 1px solid #3b4a53; border-radius: 4px; font: 11px/1.4 ui-monospace, monospace; }
      @media (max-width: 780px) { #app { grid-template-columns: 1fr; } aside { max-height: 58vh; border-right: 0; border-bottom: 1px solid #34414a; } #viewport { height: 42vh; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/studies/skin/externalStlHostV6Lab.ts"></script>
  </body>
</html>
