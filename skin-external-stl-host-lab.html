<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SKIN External STL Host Lab</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #11161b; color: #e9eef2; }
      body { margin: 0; min-height: 100vh; }
      #app { display: grid; grid-template-columns: 360px 1fr; min-height: 100vh; }
      aside { padding: 18px; background: #192128; border-right: 1px solid #34414a; overflow: auto; }
      main { min-width: 0; position: relative; }
      h1 { font-size: 18px; margin: 0 0 6px; }
      h2 { font-size: 13px; color: #9dc4d5; margin: 20px 0 8px; text-transform: uppercase; letter-spacing: .08em; }
      p, label, output, button, input, select { font-size: 12px; }
      p { color: #b5c1c8; line-height: 1.45; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0; }
      .row > label { display: grid; gap: 4px; color: #cbd5db; }
      input, select, button { box-sizing: border-box; width: 100%; border: 1px solid #4c5b64; border-radius: 4px; background: #10161a; color: #e9eef2; padding: 7px; }
      button { cursor: pointer; background: #284554; }
      button:hover { background: #356276; }
      input[type="checkbox"] { width: auto; }
      .check { display: flex; align-items: center; gap: 7px; margin: 7px 0; }
      .meta { white-space: pre-wrap; word-break: break-word; font: 11px/1.45 ui-monospace, monospace; color: #c8d4da; background: #10161a; border: 1px solid #2c3941; border-radius: 4px; padding: 9px; }
      .status { color: #8fda9b; min-height: 18px; }
      .error { color: #ff9e9e; }
      #viewport { width: 100%; height: 100vh; display: block; }
      #legend { position: absolute; left: 16px; bottom: 16px; padding: 8px 10px; background: rgba(11, 15, 18, .75); border: 1px solid #3b4a53; border-radius: 4px; font: 11px/1.4 ui-monospace, monospace; }
      @media (max-width: 760px) { #app { grid-template-columns: 1fr; } aside { max-height: 55vh; border-right: 0; border-bottom: 1px solid #34414a; } #viewport { height: 45vh; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/studies/skin/externalStlHostLab.ts"></script>
  </body>
</html>
